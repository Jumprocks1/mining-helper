name: Release Server

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      TAG: ${{github.ref_name}}
      BuildPrefix: MiningHelper-${{github.ref_name}}
      

    steps:
    - uses: actions/checkout@v6
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
        
    - name: Set Version
      run: |
        git_hash=$(git rev-parse --short "$GITHUB_SHA")
        echo "VERSION=${TAG#v}-$git_hash" >> $GITHUB_ENV
    
    - name: Publish and zip win-x64
      run: |
        cd server/MiningHelper
        dotnet publish -c Release -o mining-helper-win-x64/bin -r win-x64 -p:PublishReadyToRun=true --self-contained -p:Version=$VERSION
        cp ../../scripts/setup.bat mining-helper-win-x64
        cp ../appsettings.json mining-helper-win-x64
        cp ../../scripts/mining_helper.lua mining-helper-win-x64/bin
        zip -r $BuildPrefix-win-x64.zip mining-helper-win-x64

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: server/MiningHelper/${{env.BuildPrefix}}-win-x64.zip